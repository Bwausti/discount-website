name: Deploy Shopify Theme
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push theme
        run: |
          npm install -g @shopify/cli
          npx --yes shopify theme push \
            --store discount-mattress-4.myshopify.com \
            --theme ${{ secrets.SHOPIFY_LIVE_THEME_ID }} \
            --password ${{ secrets.SHOPIFY_CLI_PASSWORD }} \
            --allow-live
