name: Deploy Shopify Theme
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shopify CLI
        run: npm install -g @shopify/cli@3.90.0

      - name: Push theme
        run: |
          shopify theme push \
            --store discount-mattress-4.myshopify.com \
            --theme ${{ secrets.SHOPIFY_LIVE_THEME_ID }} \
            --password "${{ secrets.SHOPIFY_CLI_PASSWORD }}" \
            --allow-live
