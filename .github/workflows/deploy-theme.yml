name: Deploy Shopify Theme
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: npm install -g @shopify/cli@3.90.0 && SHOPIFY_CLI_PASSWORD="${{ secrets.SHOPIFY_CLI_PASSWORD }}" shopify theme push --store discount-mattress-4.myshopify.com --theme ${{ secrets.SHOPIFY_LIVE_THEME_ID }} --allow-live
