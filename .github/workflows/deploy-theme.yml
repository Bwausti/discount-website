name: Deploy Shopify Theme
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli

      - name: Push theme to live
        env:
          SHOPIFY_CLI_PASSWORD: ${{ secrets.SHOPIFY_CLI_PASSWORD }}
          SHOPIFY_FLAG_STORE: discount-mattress-4.myshopify.com
          SHOPIFY_FLAG_THEME: ${{ secrets.SHOPIFY_LIVE_THEME_ID }}
        run: shopify theme push --allow-live
