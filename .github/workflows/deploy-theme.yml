name: Deploy Shopify Theme
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy theme
        uses: shopify/theme-tools/action@v1
        with:
          theme_root: .
          shopify_access_token: ${{ secrets.SHOPIFY_CLI_PASSWORD }}
          shopify_store: discount-mattress-4.myshopify.com
          theme_id: ${{ secrets.SHOPIFY_LIVE_THEME_ID }}
